<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Печать</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #2481cc);
            --card-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .header { font-size: 20px; font-weight: bold; margin-bottom: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #ddd; }
        .card-content { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .card-desc { font-size: 12px; color: var(--hint); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-price { font-weight: bold; color: var(--btn); margin-top: auto; }
        .empty { text-align: center; color: var(--hint); padding: 40px 0; }
    </style>
</head>
<body>
    <div class="header">Каталог моделей</div>
    <div class="grid" id="catalog"><div class="empty">Загрузка...</div></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        async function loadCatalog() {
            try {
                const response = await fetch('/api/models');
                const models = await response.json();
                const catalogDiv = document.getElementById('catalog');
                if (models.length === 0) {
                    catalogDiv.innerHTML = '<div class="empty">Пока нет добавленных моделей.</div>';
                    return;
                }
                catalogDiv.innerHTML = models.map(model => `
                    <div class="card">
                        <img class="card-img" src="/${model.photo}" alt="${model.title}">
                        <div class="card-content">
                            <div class="card-title">${model.title}</div>
                            <div class="card-desc">${model.description}</div>
                            <div class="card-price">${model.price} ₽</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('catalog').innerHTML = '<div class="empty">Ошибка загрузки</div>';
            }
        }
        loadCatalog();
    </script>
</body>
</html>
